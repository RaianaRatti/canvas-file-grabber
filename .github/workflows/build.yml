name: Build and Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            output_name: CanvasFileGrabber.exe
            asset_name: CanvasFileGrabber-Windows.exe
          - os: macos-latest
            output_name: CanvasFileGrabber
            asset_name: CanvasFileGrabber-Mac.dmg
          - os: ubuntu-latest
            output_name: CanvasFileGrabber
            asset_name: CanvasFileGrabber-Linux.zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          playwright install chromium

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --name CanvasFileGrabber --windowed --onefile `
            --collect-all playwright --collect-all webview `
            --add-data "web;web" --add-data "config.example.json;." `
            --icon icon.ico `
            run.py

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --name CanvasFileGrabber --windowed --onefile \
            --collect-all playwright --collect-all webview \
            --add-data "web:web" --add-data "config.example.json:." \
            --icon icon.icns \
            run.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1
          pyinstaller --name CanvasFileGrabber --windowed --onefile \
            --collect-all playwright --collect-all webview \
            --add-data "web:web" --add-data "config.example.json:." \
            run.py

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Canvas File Grabber" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon CanvasFileGrabber.app 150 190 \
            CanvasFileGrabber-Mac.dmg dist/CanvasFileGrabber.app

      - name: Zip Linux build
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../CanvasFileGrabber-Linux.zip CanvasFileGrabber
          cd ..

      - name: Upload Windows release
        if: runner.os == 'Windows'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/CanvasFileGrabber.exe
          asset_name: CanvasFileGrabber-Windows.exe
          asset_content_type: application/octet-stream

      - name: Upload macOS release
        if: runner.os == 'macOS'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./CanvasFileGrabber-Mac.dmg
          asset_name: CanvasFileGrabber-Mac.dmg
          asset_content_type: application/octet-stream

      - name: Upload Linux release
        if: runner.os == 'Linux'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./CanvasFileGrabber-Linux.zip
          asset_name: CanvasFileGrabber-Linux.zip
          asset_content_type: application/zip