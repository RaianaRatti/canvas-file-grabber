name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: CanvasFileGrabber-Windows.exe
          - os: macos-latest
            artifact: CanvasFileGrabber-Mac.zip
          - os: ubuntu-latest
            artifact: CanvasFileGrabber-Linux.zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          playwright install chromium

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --name CanvasFileGrabber --windowed --onefile `
            --collect-all playwright --collect-all webview `
            --paths src `
            --add-data "web;web" --add-data "config.example.json;." `
            run.py
          move dist\CanvasFileGrabber.exe CanvasFileGrabber-Windows.exe

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --name CanvasFileGrabber --windowed --onefile \
            --collect-all playwright --collect-all webview \
            --paths src \
            --add-data "web:web" --add-data "config.example.json:." \
            run.py
          cd dist
          zip -r ../CanvasFileGrabber-Mac.zip CanvasFileGrabber.app
          cd ..

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1
          pyinstaller --name CanvasFileGrabber --windowed --onefile \
            --collect-all playwright --collect-all webview \
            --paths src \
            --add-data "web:web" --add-data "config.example.json:." \
            run.py
          cd dist
          zip -r ../CanvasFileGrabber-Linux.zip CanvasFileGrabber
          cd ..

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}