<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas File Grabber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login view -->
  <section id="login-view" class="view">
    <div class="login-card">
      <div class="lamp"></div>
      <h1>Canvas File Grabber</h1>
      <p class="subtitle">Log in to load your courses. Your password is typed into Canvas, never into this app.</p>
      <button id="login-btn" class="primary">Log in to Canvas</button>
      <p id="login-status" class="status"></p>
    </div>
  </section>

  <!-- Loading view: shown right after login while courses load -->
  <section id="loading-view" class="view hidden">
    <div class="login-card">
      <div class="lamp"></div>
      <div class="spinner"></div>
      <h1>You're logged in</h1>
      <p class="subtitle">Opening your files — your courses are loading and will appear in just a moment.</p>
    </div>
  </section>

  <!-- Main view -->
  <section id="main-view" class="view hidden">
    <header class="topbar">
      <div>
        <span class="eyebrow">Canvas File Grabber</span>
        <h1>Your courses</h1>
      </div>
      <div class="topbar-actions">
        <label class="toggle">
          <input type="checkbox" id="show-past" checked>
          <span>Show past courses</span>
        </label>
        <button id="settings-btn" class="icon-btn" aria-label="Theme settings" title="Theme">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <div id="course-list" class="course-list"></div>

    <footer class="actionbar">
      <div class="field">
        <label for="ext-input">File endings</label>
        <input type="text" id="ext-input" placeholder=".pdf, .pptx, .docx">
      </div>
      <div class="field">
        <label>Save to</label>
        <div class="folder-pick">
          <button id="folder-btn" class="folder-dest" title="Click to choose a different folder">
            <svg class="folder-dest-icon icon-folder" viewBox="0 0 48 38" xmlns="http://www.w3.org/2000/svg"><path d="M3 6a3 3 0 0 1 3-3h11l4 5h21a3 3 0 0 1 3 3v20a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/></svg>
            <span id="folder-path" class="path">downloads</span>
          </button>
        </div>
      </div>
      <button id="download-btn" class="primary" disabled>Download selected</button>
    </footer>

    <div id="progress" class="progress hidden">
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
      <p id="progress-text" class="status"></p>
    </div>
  </section>

  <!-- Theme picker -->
  <div id="theme-modal" class="modal hidden">
    <div class="theme-panel">
      <div class="theme-head">
        <h2 class="theme-title">Theme</h2>
        <button id="theme-close" class="theme-x" aria-label="Close">✕</button>
      </div>

      <div class="theme-group">
        <span class="theme-label">Dark</span>
        <div id="dark-swatches" class="swatch-grid"></div>
      </div>

      <div class="theme-group">
        <span class="theme-label">Light</span>
        <div id="light-swatches" class="swatch-grid"></div>
      </div>

      <div class="theme-group">
        <span class="theme-label">Mono</span>
        <div id="mono-swatches" class="swatch-grid"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
